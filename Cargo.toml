[package]
name = "stormlb"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust API/ingress VIP load balancer for the Storm stack — health-checked L4 balance + VRRP (L2) / BGP-anycast (L3). The pre-cluster control-plane LB."
repository = "https://github.com/glennswest/stormlb"

[[bin]]
name = "stormlb"
path = "src/main.rs"

[lib]
name = "stormlb"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
socket2 = { version = "0.5", features = ["all"] }
# rtnetlink and the gratuitous ARP socket (src/vip.rs): no `ip`/`arping` on a node.
libc = "0.2"
# The router's TLS listener (src/tls.rs): ring, as reqwest's rustls already
# uses, so the lockfile gains no crate; webpki for matching a certificate to
# the SNI name.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
# The router's HTTP/1.1 proxy (#37, per-request routing #26): hyper on both
# sides, already in the lockfile through reqwest (the server feature adds
# httpdate).
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
