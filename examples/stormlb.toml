# stormlb example: kube-api VIP fronting three masters, L2 (VRRP) mode, plus
# the L7 router. Every key is listed in README "Configuration" with its default.
# The shipped golden uses only `[router]` with `listen = "auto:80"`.

[vip]
address = "192.168.8.50"   # the VIP clients/kubelets target
port = 6443
# bind = "0.0.0.0"         # where the L4 proxy listens (default 0.0.0.0)

[[backend]]
address = "192.168.8.51"   # master1 apiserver
port = 6443
[[backend]]
address = "192.168.8.52"   # master2
port = 6443
[[backend]]
address = "192.168.8.53"   # master3
port = 6443

[health]
mode = "https"             # tcp | http | https
path = "/readyz"
# ca_file = "/data/stormcert/ca.crt"   # verify https checks; unset = accept any cert
interval_secs = 2
timeout_secs = 2
expect_status = [200]

# L2 mode: one node owns the VIP (VRRP); failover after master-down
# (3 x advert + skew, 3.6 s at advert_interval_secs = 1).
[vrrp]
enabled = true
interface = "eth0"
vrid = 51
priority = 200             # 255 = address owner, starts Master; others start Backup
# preempt = true           # a Backup takes over from a lower-priority Master
                           # Ownership follows health: no healthy backend, no VIP.
advert_interval_secs = 1

# L3 mode: every node with a healthy backend advertises the VIP /32; the
# upstream router ECMP-hashes across them. 2-byte ASNs only.
[bgp]
enabled = false
local_asn = 64512
router_id = "192.168.8.51"
# [[bgp.peers]]
# address = "192.168.8.1"
# asn = 64512

# The VIP API: named VIPs made and changed at runtime (stormcluster keeps
# the cluster's API VIP in front of the masters through it). Present =
# enabled. The [vip] above is the VIP "default", read-only through it.
# [api]
# listen = "127.0.0.1:9103"              # off loopback, token_file is required
# token_file = "/etc/stormlb/api-token"  # Authorization: Bearer <token>
# state_file = "/var/lib/stormlb/vips.json"

# Prometheus metrics: router requests/latency/errors/connections, VIP
# connections and backend health, process_*. Present = enabled.
# [metrics]
# listen = "auto:9104"                   # node address + loopback

# The L7 Host-header router over HTTPRoutes. Present = enabled; alone, it is a
# complete config (no [vip] needed).
# [router]
# listen = "auto:80"                     # node address + 127.0.0.1; default "0.0.0.0:80"
# apiserver = "https://127.0.0.1:6443"
# poll_secs = 5
# insecure = true                        # leave on: no CA-file key, webpki roots only (stormlb#10)
#
# TLS for routed hosts: certificates by SNI, re-read when they change; :80
# redirects to https (except /healthz) once one is loaded.
# [router.tls]
# listen = "auto:443"
# certs = [{ cert_file = "/data/stormcert/router.crt", key_file = "/data/stormcert/router.key" }]
# redirect = true
# reload_secs = 30
